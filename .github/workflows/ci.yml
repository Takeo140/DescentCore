name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install elan (Lean toolchain manager)
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Install the pinned Lean toolchain
        run: |
          elan toolchain install leanprover/lean4:v4.36.0-rc2
          elan default leanprover/lean4:v4.36.0-rc2
          lean --version

      - name: Check DescentCore.lean (compile; fail on any sorry)
        run: |
          set -o pipefail
          lean DescentCore.lean 2>&1 | tee build.log
          ! grep -q "declaration uses 'sorry'" build.log
